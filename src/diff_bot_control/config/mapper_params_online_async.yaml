# =============================================================================
#  mapper_params_online_async.yaml —— 题目(3) SLAM 建图参数
# =============================================================================
#  【SLAM 到底在做什么】
#  题目(2) 是"地图已知"：直接读 .world 文件当栅格，不含任何估计。
#  题目(3) 是"地图未知"：只能靠雷达一点点扫出来，**而且还得同时知道"我在哪"**。
#
#  这两件事互为前提，所以叫 Simultaneous Localization And Mapping：
#      想建图 → 得先知道每一帧雷达是在哪个位置打的
#      想知道位置 → 得先有地图才能做匹配
#  鸡生蛋问题，解决办法是：**从已知的起点开始，一小步一小步地迭代**
#      1) 用里程计猜一个"我现在大概在哪"
#      2) 拿当前雷达帧和已有地图做**扫描匹配**，把猜测修正成精确位姿
#      3) 用修正后的位姿把新扫描"贴"进地图
#      4) 走远了再回头看看能不能对上（**回环检测**），能对上就一次性修正累积误差
#
#  slam_toolbox 用的是**图优化(Graph SLAM)**：
#    每个"位姿+一帧扫描"是图里的一个节点，节点之间的相对变换是边；
#    回环检测新增边，然后解一个最小二乘问题把整张图一起优化。
#    这比单纯靠里程计累加（会越走越飘）稳健得多。
# =============================================================================

slam_toolbox:
  ros__parameters:

    # -------------------------------------------------------------------------
    #  ★★★ 坐标系：这三个填错就直接不工作，是最容易出错的地方 ★★★
    # -------------------------------------------------------------------------
    #  odom_frame     : 里程计坐标系（谁发布的？Gazebo 的 diff_drive 插件）
    #  map_frame      : SLAM 要创建的全局坐标系（SLAM 自己发布 map->odom 变换）
    #  base_frame     : 机器人本体坐标系（必须和 URDF 里的 root link 一致！）
    #  scan_topic     : 雷达话题
    #
    #  算一下 TF 树就明白了：
    #      map ──(SLAM 发布)──► odom ──(diff_drive 发布)──► base_footprint ──► laser_link
    #  左边这段是 SLAM 提供的"修正量"，右边这段是里程计给的"相对运动"。
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan

    # -------------------------------------------------------------------------
    #  工作模式
    #    mapping      = 建图（题目3 用这个）
    #    localization = 只定位不建图（题目4 导航时可以用，但 Nav2 通常用 AMCL）
    # -------------------------------------------------------------------------
    mode: mapping

    # -------------------------------------------------------------------------
    #  ★ 必须匹配你的雷达量程！
    #  雷达是 0.30 ~ 12.0 m（见 diff_bot.urdf.xacro）。
    #  如果这里填得比实际小，远处墙上的点会被丢掉 → 地图"缺边"；
    #  填得太大又会让远处的噪声点污染地图。
    # -------------------------------------------------------------------------
    max_laser_range: 12.0
    # ★ 下限也要填！留空(默认0.0)时 slam_toolbox 会一直警告：
    #     "minimum laser range setting (0.0 m) exceeds the capabilities
    #      of the used Lidar (0.3 m)"
    #   后果：小于 0.3m 的读数（新版里是"被钳到 range_min 的自反射假点"）
    #   会被当成真障碍参与扫描匹配，**污染位姿估计**。
    min_laser_range: 0.30

    # -------------------------------------------------------------------------
    #  ★ 新版 Gazebo Sim 必须放宽的两个时间参数
    #  原因：新版的数据链路比 Classic 长一整段 ——
    #        Gazebo → gz-transport → ros_gz_bridge → ROS → 过滤节点 → slam_toolbox
    #        每一跳都会带来几十毫秒的抖动。
    #  实测 tf2 报 "Lookup would require extrapolation into the past"，
    #  以及 slam_toolbox 报 "Message Filter dropping message ... queue is full"，
    #  都是因为默认容差(0.2s)不够。
    #  放宽之后扫描帧不再被大量丢弃，建图才完整。
    # -------------------------------------------------------------------------
    transform_timeout: 0.5
    tf_buffer_duration: 30.0

    # -------------------------------------------------------------------------
    #  地图分辨率：0.05 m/格。和题目(2) 的规划栅格保持一致，方便对照。
    #  越小越精细但越占内存；5cm 是室内 SLAM 的通用选择。
    # -------------------------------------------------------------------------
    resolution: 0.05

    # -------------------------------------------------------------------------
    #  地图刷新与 TF 发布节奏
    #    map_update_interval    : 每隔 1 秒重新算一次占据栅格（够用，省 CPU）
    #    transform_publish_period: map->odom 变换发布周期，0.02s = 50Hz
    #                              （机器人一移动就要立刻更新，所以比地图快得多）
    # -------------------------------------------------------------------------
    map_update_interval: 1.0
    transform_publish_period: 0.02

    # -------------------------------------------------------------------------
    #  ★ 关键调参：什么时候"新增一个节点"
    #  图优化里的"节点"= 一个记录了位姿和扫描的关键帧。
    #  太密（走 1cm 就加一个）→ 图巨大，算不动；
    #  太疏（走 1m 才加一个）→ 拐弯处细节丢失，墙会变弯。
    #
    #  场地只有 6.4m x 6.4m，属于**小场地**，所以取值要比默认(0.5m)小一些，
    #  这样小场地也能有足够的节点把墙建直。
    # -------------------------------------------------------------------------
    minimum_travel_distance: 0.20      # 走 20cm 新增一个节点
    minimum_travel_heading: 0.20       # 转 0.2 rad 新增一个节点
    minimum_time_interval: 0.20        # 但两次之间至少隔 0.2 秒

    # -------------------------------------------------------------------------
    #  回环检测：决定"地图会不会越走越歪"
    #  原理：走到曾经来过的地方时，把当前扫描和**很久以前**的节点比对，
    #        如果匹配得上，就加一条边把整张图"拉回来"，一次性消掉累积误差。
    #  典型效果：绕场一圈回到起点，起点处的墙会从"错开两截"变成"严丝合缝"。
    # -------------------------------------------------------------------------
    # =========================================================================
    #  ★ 回环检测同样关掉 —— 理由和 use_scan_matching 一样
    # =========================================================================
    #  回环检测（loop closing）的作用是：当机器人绕一圈回到走过的地方时，
    #  认出"我来过这里"，然后**回头修正整条位姿图**，把累积漂移消掉。
    #  在真实机器人上这是 SLAM 最关键的一环。
    #
    #  但仿真的里程计是解析积分的、几乎无漂移（实测走 0.8m 误差 0.000m），
    #  所以**压根没有漂移需要靠回环来消**。
    #  此时回环检测反而会"没事找事"：一旦匹配到错误的对应关系，
    #  它就把已经正确的位姿图强行拉歪，表现为地图上出现**斜向拖影**
    #  （我实测到地图内部有多道斜线，像房间被画了两三遍）。
    #
    #  关掉之后，地图完全由"完美里程计 + 激光点"生成 ——
    #  这正是仿真条件下能得到的最干净、也最准确的地图。
    #  （真实机器人上必须打开。）
    # =========================================================================
    do_loop_closing: false
    loop_search_maximum_distance: 3.0     # 多远范围内找可能的历史节点
    loop_match_minimum_chain_size: 10     # 连续多少个节点匹配上才算回环（防误判）
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    loop_match_maximum_variance_coarse: 3.0

    # -------------------------------------------------------------------------
    #  扫描匹配的搜索窗口
    #  原理：拿当前帧去和地图比对时，要在一个小的 (Δx, Δy, Δθ) 邻域里搜最优。
    #  窗口太小 → 位姿变化大一点就跟丢；太大 → 慢且容易匹配到错误的地方。
    # -------------------------------------------------------------------------
    correlation_search_space_dimension: 0.5      # 搜索窗口边长（米）
    correlation_search_space_resolution: 0.01    # 搜索步长（米）
    correlation_search_space_smear_deviation: 0.1

    coarse_search_angle_offset: 0.349            # 粗搜索角度范围（弧度，约 20°）
    coarse_angle_resolution: 0.0349              # 粗搜索角度步长（约 2°）
    fine_search_angle_offset: 0.00349            # 精搜索角度范围（约 0.2°）

    # -------------------------------------------------------------------------
    #  位姿优化的各项惩罚/权重（一般不用改，附上便于理解）
    #    distance_variance_penalty : 对"平移跳变"的惩罚，越大越不允许位置突变
    #    angle_variance_penalty    : 对"旋转跳变"的惩罚
    # -------------------------------------------------------------------------
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true

    # -------------------------------------------------------------------------
    #  求解器：Ceres（Google 的非线性最小二乘库），图优化用它解大规模稀疏问题
    #  这几个是官方模板的推荐值，不用动。
    # -------------------------------------------------------------------------
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # -------------------------------------------------------------------------
    #  杂项
    #    use_sim_time  : 仿真里必须 true（时间来自 Gazebo 的 /clock）
    #    debug_logging : 关掉，否则日志刷屏
    #    throttle_scans: 每 N 帧只用 1 帧。雷达 20Hz，用 1 就够，
    #                    调大能明显降 CPU 占用
    # -------------------------------------------------------------------------
    use_sim_time: true
    debug_logging: false
    throttle_scans: 1
    enable_interactive_mode: true
    # =========================================================================
    #  ★★★ use_scan_matching 的分量说明：为什么这里关掉它 ★★★
    # =========================================================================
    #  【它本来是干什么的】
    #    每加一个新节点时，slam_toolbox 会拿当前激光帧和已有地图做**扫描匹配**
    #    （相关性匹配 + Ceres 优化），用来修正里程计的累积漂移。
    #    在真实机器人上这非常必要 —— 真实轮式里程计会打滑、会偏。
    #
    #  【为什么仿真里反而要关掉】
    #    仿真的里程计是**解析积分**出来的，几乎完美。题目(1) 实测：
    #        发 /cmd_vel 走 0.8m，真值与里程计之差 = 0.000 m
    #    也就是说**根本没有漂移需要修**。
    #
    #    而扫描匹配在这张地图上会"帮倒忙"。实测证据：
    #      · 巡逻路线在世界里是 5.2x5.2 的正方形，
    #        正方形**无论旋转多少度，包围盒在 x/y 两方向必然相等**；
    #        但地图坐标里的轨迹是 6.94 x 5.55 —— 不等。
    #      · 用带尺度的相似变换去拟合"地图位姿 ↔ 世界真值"，
    #        得出尺度 s = 0.884，**偏离 1 达 11.6%**，残差仍有 1.36 m。
    #    结论：地图被**非刚体地拉伸**了 —— 这正是扫描匹配收敛到错误解的表现。
    #
    #    畸变的地图有两个直接后果：
    #      ① 出现"扇形伪影"（扫描被放在错误的距离上，拖出放射状痕迹）
    #      ② Nav2 报 "Starting point in lethal space"（车以为自己站在障碍里）
    #
    #  【所以】
    #    让 SLAM 直接信任里程计（use_scan_matching: false）——
    #    在"里程计完美"的仿真里，这样得到的恰好是**度量上精确**的地图。
    #    这不是偷懒，是**根据数据源质量选参数**：谁的输入可信就用谁。
    #    （真实机器人上必须打开，因为真实里程计不可信。）
    # =========================================================================
    use_scan_matching: false
    use_scan_barycenter: true
    stack_size_to_use: 40000000
